spring.application.name=Government Asset Tracking
spring.datasource.url=jdbc:h2:file:./data/assets;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=${SERVER_ADDRESS:0.0.0.0}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
tracking.mode=${TRACKING_MODE:windows}
tracking.interval-ms=2000
tracking.admin-password=${ADMIN_PASSWORD:}
tracking.officer-password=${OFFICER_PASSWORD:}
